    <style>
      .action {
        margin: 30px auto;
        width: 900px;
        height: 650px;
        background-color: white;
        border: none;
        box-shadow: 3px 2px 10px rgba(0, 0, 0, 0.1);
      }

      .a {
        width: 100%;
        position: relative;
      }
      .a img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      .b {
        display: flex;
        position: absolute;
        gap: 10px;
        left: 30%;
        transform: translateY(-50px);
      }
      .b img {
        width: 150px;
        height: 100px;
      }
      h1 {
        text-align: center;
        margin-top: 80px;
      }
      p {
        text-align: center;
        margin-top: 20px;
      }
      .c {
        margin-top: 70px;
        padding: 20px 50px;
      }
      .mot,
      .hai,
      .ba,
      .bon {
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
      }
      select {
        width: 405px;
        max-width: 60%;
        height: 30px;
        border-radius: 3px;
      }
      .input {
        width: 700px;
        max-width: 50%;
        height: 30px;
        border-radius: 3px;
        border: 1px solid #ccc;
      }
    </style>
