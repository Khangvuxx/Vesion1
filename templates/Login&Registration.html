<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Login&Registration.css') }}">
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="Header">
      <nav class="Navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </nav>

      <form action="" class="Searchbar">
        <input type="text" placeholder="Search..." />
        <button type="button" class="Searchbarbtn">
          <!-- ✅ Đổi bxr → bx -->
          <i class="bx bx-search"></i>
        </button>
      </form>
    </header>
    <div class="background"></div>
    <div class="container">
      <div class="content">
        <h2 class="logo">
          <i class="bx bxl-firebase"></i>
          Booking
        </h2>

        <div class="text-sci">
          <h2>Welcome!<br /><span>To Our New Website.</span></h2>
          <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>

          <div class="social-icons">
            <a href="#"><i class="bx bxl-linkedin"></i></a>
            <a href="#"><i class="bx bxl-facebook-circle"></i></a>
            <a href="#"><i class="bx bxl-instagram"></i></a>
            <a href="#"><i class="bx bxl-twitter"></i></a>
          </div>
        </div>
      </div>

      <div class="logreg-box">
        <div class="form-box login">
          <form action="/login" method="POST" autocomplete="off">
            <h2>Sign In</h2>
            <div class="input-box">
              <span class="icon"><i class="bx bx-envelope"></i> </span>
              <input type="email" name="email" required />
              <label for="">Email</label>
            </div>

            <div class="input-box">
              <span class="icon"><i class="bx bx-lock"></i> </span>
              <input type="password" name="password" required/>
              <label for="">Password</label>
            </div>
            <div class="Remember-forgot">
              <label><input type="checkbox" />Remember me</label>
              <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <div class="login-register">
              <p>
                Don't have an account?
                <a href="#" class="register-Link">Register</a>
              </p>
          </form>
        </div>
      </div>
      <div class="form-box register">
          <form action="/register" method="POST" autocomplete="off">
            <h2>Sign Up</h2>
            <div class="input-box">
              <span class="icon"><i class='bx  bx-user'  ></i> </span>
              <input type="text" name="name" required />
              <label for="">Name</label>
            </div>
            <div class="input-box">
              <span class="icon"><i class="bx bx-envelope"></i> </span>
              <input type="email" name="email" required />
              <label for="">Email</label>
            </div>

            <div class="input-box">
              <span class="icon"><i class="bx bx-lock"></i> </span>
              <input type="password" name="password" required/>
              <label for="">Password</label>
            </div>
            <div class="Remember-forgot">
              <label><input type="checkbox" />I agree to the terms & conditions</label>
            </div>
            <button type="submit" class="btn">Sign Up</button>
            <div class="login-register">
              <p>
                Already have an account? 
                <a href="#" class="login-Link">Sing In</a>
              </p>
          </form>
      </div>
    </div>

    <script src="{{ url_for('static', filename='Login&Registration.js') }}"></script>
  </body>
</html>
